[project]
name = "review_crew"
version = "0.1.0"
description = "review_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.12.2",
    "gradio>=6.26.0",
    "python-dotenv>=1.1.1",
]

[project.scripts]
review_crew = "review_crew.main:run"
run_crew = "review_crew.main:run"
train = "review_crew.main:train"
replay = "review_crew.main:replay"
test = "review_crew.main:test"
run_with_trigger = "review_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
