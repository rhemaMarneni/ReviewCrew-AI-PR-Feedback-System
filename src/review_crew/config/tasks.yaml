frontend_review_task:
  description: >
    Review the frontend code for {project_name} according to the frontend reviewer's
    expertise and the project requirements.

    Project description:
    {project_description}

    Focus only on frontend and UX concerns. If you notice an issue that clearly
    belongs to another reviewer, note it briefly as out of scope.
  expected_output: >
    A markdown frontend review containing:
    1. A short summary
    2. Findings with title, severity, location, issue, impact, and recommendation
    3. Frontend strengths worth preserving
    4. Out-of-scope findings for other reviewers

    Return markdown only.
  agent: frontend_reviewer
  markdown: true
  output_file: output/frontend_review.md

