frontend_review_task:
  description: >
    Review the frontend code for the given GitHub Pull Request URL according to the frontend reviewer's
    expertise and the project requirements.

    Project Information:
    {project_info}

    {file_review_instructions}
    If there are no frontend files, say so and return no invented findings.

    Focus only on frontend and UX concerns, and do not regard anything that is out of scope a the frontend engineer.
  expected_output: >
    {specialist_expected_output}

  agent: frontend_reviewer
  context:
    - codebase_analyzer_task

backend_review_task:
  description: >
    Review the backend code for the given GitHub Pull Request URL according to the backend reviewer's
    expertise and the project requirements.

    Project Information:
    {project_info}

    {file_review_instructions}
    If there are no backend files, say so and return no invented findings.

    Focus only on backend concerns, and do not regard anything that is out of scope a the backend engineer.
  expected_output: >
    {specialist_expected_output}

  agent: backend_reviewer
  context:
    - codebase_analyzer_task

security_review_task:
  description: >
    Review the security of the given GitHub Pull Request URL according to the security reviewer's
    expertise and the project requirements.

    Project Information:
    {project_info}

    {file_review_instructions}
    If there are no security-relevant files, say so and return no invented findings.

    Focus only on security concerns, and do not regard anything that is out of scope a the security engineer.
  expected_output: >
    {specialist_expected_output}

  agent: security_reviewer
  context:
    - codebase_analyzer_task

test_review_task:
  description: >
    Review the tests and testability of the given GitHub Pull Request URL according to the test
    reviewer's expertise and the project requirements.

    Project Information:
    {project_info}

    {file_review_instructions}
    If there are no test files, review testability of the changed code you can fetch, or say coverage is missing.

    Focus only on testing concerns, and do not regard anything that is out of scope a the test engineer.
  expected_output: >
    {specialist_expected_output}

  agent: test_reviewer
  context:
    - codebase_analyzer_task

lead_review_task:
  description: >
    Review the overall system design and architecture of the project specified in the project description according
    to the lead reviewer's expertise, the project requirements, and the specialist
    reviews.

    Project Information:
    {project_info}

    Use the codebase analysis and specialist reviews. If you need to verify a
    cross-cutting claim, read the file with github_client: action=get_file and pr_url={pr_url}.

    You may agree or disagree with specialist findings and explain why, but do
    not modify or overwrite them. Preserve the originals and add your assessment
    separately. Focus on how components fit together rather than duplicating
    specialist reviews.
  expected_output: >
    A LeadReview Pydantic output.

  agent: lead_reviewer
  context:
    - codebase_analyzer_task
    - frontend_review_task
    - backend_review_task
    - security_review_task
    - test_review_task

codebase_analyzer_task:
  description: >
    Analyze the repository and pull request at the exact URL found in the project information: {project_info}

    Use the github_client tool and pass that full pr_url on every call.
    Do not shorten it to https://github.com/ or invent a different URL.

    Classify files and identify technologies, frameworks, libraries, and languages.
  expected_output: >
    A CodebaseAnalysis Pydantic output.
  agent: codebase_analyzer

review_manager_task:
  description: >
    Oversee and direct the review process from start to finish by routing the process to the appropriate agents and tasks.
  expected_output: >
    Copy completed specialist and lead outputs into a Report. A Report Pydantic output.
    You are NOT supposed to review the code in any capacity.
  agent: review_manager
