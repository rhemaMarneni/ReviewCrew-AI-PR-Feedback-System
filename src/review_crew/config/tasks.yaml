lead_review_task:
  description: >
    Review the overall system design and architecture of {project_name} according
    to the lead reviewer's expertise, the project requirements, and the specialist
    reviews.

    Project description:
    {project_description}

    You may agree or disagree with specialist findings and explain why, but do
    not modify or overwrite them. Preserve the originals and add your assessment
    separately. Focus on how components fit together rather than duplicating
    specialist reviews.
  expected_output: >
    A markdown lead review containing:
    1. A short summary
    2. Architecture findings with title, severity, location, issue, impact, and recommendation
    3. Assessment of specialist findings without editing the originals
    4. Original specialist reviews preserved verbatim
    5. Cross-cutting findings and prioritized recommendations

    Return markdown only.
  agent: lead_reviewer
  markdown: true
  context:
    - frontend_review_task
    - backend_review_task
    - security_review_task
    - test_review_task
  output_file: output/review.md

codebase_analyzer_task:
  description: >
    Analyze the repository and pull request at this exact URL: {pr_url}

    Use the github_client tool and pass that full pr_url on every call.
    Do not shorten it to https://github.com/ or invent a different URL.

    Classify files and identify technologies, frameworks, libraries, and languages.
  expected_output: >
    A structured Pydantic output with:
    - Which files are classifed into frontend, backend, security, testing, and documentation categories.
    - What technologies, frameworks, libraries, and languages are used in the codebase.
  agent: codebase_analyzer
  markdown: true
  output_file: output/codebase_analyzer.md

review_manager_task:
  description: >
    Oversee and direct the review process from start to finish by routing the process to the appropriate agents and tasks.
  expected_output: >
    You are NOT supposed to review the code in any capacity.
    Generate a final markdown containing:
    - Project Name
    - The findings of the specialized reviewers separated by sections with the lead reviewer's findings at the end.
    - A final section specifying: --> needs to be done by the lead reviewer
      - Whether the Pull Request is ready to be merged or declined.
      - Whether there are any issues that need to be addressed or not.
      - Merge conflicts if any.
  agent: review_manager
  markdown: true
  output_file: output/review_manager.md

   each section should have a title, a "Review Severity level" as Critical, High, Medium, Low and a summary of the findings.